    function handleSelect(sheet, model) {
      if (!model) return;
      const headers = data[sheet].headers;
      const rows = data[sheet].rows;
      const index = headers.indexOf(model);
      if (index === -1) return;

      document.getElementById("result").innerHTML = "";

      for (let cat in selectGroups) {
        if (cat !== sheet) {
          document.getElementById("select-" + cat).value = "";
        }
      }

      let html = `<h2 class="text-xl font-bold mb-3">${sheet} - ${model}</h2>`;
      html += "<table class='table-auto w-full border border-gray-400 text-sm'><thead><tr><th class='border px-1 py-1 bg-gray-100 text-center whitespace-pre-wrap min-w-[120px]'></th><th class='border px-2 py-1 text-center'>" + model + "</th></tr></thead><tbody>";
      for (let i = 1; i < rows.length; i++) {
        html += `<tr><td class='border px-1 py-1 bg-gray-100 text-center whitespace-pre-wrap min-w-[120px]'>${rows[i][0]}</td><td class='border px-2 py-1 text-center'>${rows[i][index]}</td></tr>`;
      }
      html += "</tbody></table>";
      document.getElementById("result").innerHTML = html;
    }

        message?.classList.add("hidden");
        container.innerHTML = "";
      });

      document.getElementById("btn-ftr").addEventListener("click", () => {

        document.getElementById("part-section").classList.add("hidden");
        message?.classList.remove("hidden");
      });

      for (let cat in selectGroups) {

function renderFtrTable(sheet) {
  const container = document.getElementById("ftr-result");
  container.innerHTML = "";

  const data = ftrData[sheet];
  const values = data.values;
  const bg = data.bg_colors;
  const color = data.font_colors;

  const table = document.createElement("table");
  table.className = "border border-gray-400";

  const tbody = document.createElement("tbody");
  for (let i = 0; i < values.length; i++) {
    const tr = document.createElement("tr");
    for (let j = 0; j < values[i].length; j++) {
      const td = document.createElement(i === 0 ? "th" : "td");
      td.textContent = values[i][j];
      if (j % 2 === 0) { td.style.backgroundColor = '#f3f4f6'; } else { td.style.backgroundColor = bg[i][j]; }
      td.style.color = color[i][j];
      td.style.border = "1px solid #ccc";
      td.style.padding = "4px 8px";
      td.style.whiteSpace = "pre-wrap";
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.appendChild(table);
}

    document.getElementById("device-section").classList.add("hidden");

    btn.addEventListener("click", () => {

      renderFtrTable(sheet);

  });
});

  try { const s=await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})},false);session={...s,expires_at:Date.now()/1000+s.expires_in}; }
  catch(e){session=null;syncAdminUI();throw Error('登入已過期，請重新登入。');}
 }
}
async function rowsFor(model) {
 let rows=[],offset=0;
 for(;;){
  const batch=await http('/rest/v1/equipment_records?select=*&model=eq.'+encodeURIComponent(model)+'&order=sort_order.asc,created_at.asc,id.asc&limit=500&offset='+offset,{},false);
  if(!Array.isArray(batch)) throw Error('資料庫回傳格式不正確。');
  rows.push(...batch); if(batch.length<500) return rows; offset+=batch.length;
 }
}
function seedRows(model) { return INITIAL_DATA[model].data.map((cells,i)=>({cells,style:{backgrounds:INITIAL_DATA[model].backgrounds[i],fontColors:INITIAL_DATA[model].fontColors[i],fontSizes:INITIAL_DATA[model].fontSizes[i],fontWeights:INITIAL_DATA[model].fontWeights[i]}})); }
function drawRows(model,rows) {
 activeRows={model,rows};
 const q=$('search-input').value.trim().toLocaleLowerCase();
 const filtered=rows.filter(r=>r.cells.some(c=>String(c??'').toLocaleLowerCase().includes(q)));
 container.replaceChildren();
 if(!filtered.length){container.textContent=rows.length?'找不到符合條件的資料。':'此機種尚無資料。請新增資料，或先執行初始資料 SQL。';return;}
 const obj={data:[],backgrounds:[],fontColors:[],fontSizes:[],fontWeights:[]};
 filtered.forEach(r=>{
  obj.data.push(r.cells);
  for(const key of ['backgrounds','fontColors','fontSizes','fontWeights']) obj[key].push(r.cells.map((_,i)=>r.style?.[key]?.[i] ?? ({backgrounds:i===0?'#efefef':'#ffffff',fontColors:'#000000',fontSizes:10,fontWeights:'normal'})[key]));
 });
 renderStyledTable(model+'（'+filtered.length+' 筆）',obj);
 addRowActions(filtered);
}
async function loadEquipment(model) {
 const version=++viewVersion; if(!isCloudModel(model))return;
 activeRows=null;container.textContent='讀取資料中…';
 try {const rows=config.url?await rowsFor(model):(Object.hasOwn(INITIAL_DATA,model)?seedRows(model):[]);if(version!==viewVersion||sheetSelect.value!==model)return;drawRows(model,rows);}
 catch(e){if(version!==viewVersion||sheetSelect.value!==model)return;container.textContent='無法讀取雲端資料。請確認設定與網路後按重新整理。';notice(e.message,true);}
}
function refresh(){sheetSelect.dispatchEvent(new Event('change'));}
$('search-btn').addEventListener('click',()=>{if(sheetSelect.value==='D6對折裝訂調整'){notice('此內建調整表保留完整格式；請使用瀏覽器的「在頁面中尋找」。');return;}refresh();});
$('search-input').addEventListener('keydown',e=>{if(e.key==='Enter')$('search-btn').click();});
$('refresh-data').onclick=refresh;

$('login-open').onclick=()=>$('login-panel').classList.toggle('hidden');
Object.keys(INITIAL_DATA).forEach(name=>$('add-model').add(new Option(name,name)));
$('add-open').onclick=()=>{
 if(!config.url){notice('資料庫連線設定遺失，請聯絡管理者。',true);return;}
 if(!session){$('login-panel').classList.remove('hidden');$('login-email').focus();notice('登入管理者帳號後即可新增資料。');return;}
 if(isCloudModel(sheetSelect.value))$('add-model').value=sheetSelect.value;
 closeEditor();toggleNewModel();$('add-panel').classList.remove('hidden');$('add-title').focus();
};
$('add-cancel').onclick=()=>$('add-panel').classList.add('hidden');
$('login-form').onsubmit=async e=>{
 e.preventDefault();const btn=e.submitter;btn.disabled=true;
 try {const s=await http('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('login-email').value.trim(),password:$('login-password').value})},false);session={...s,expires_at:Date.now()/1000+s.expires_in};
 const access=await http('/rest/v1/equipment_editors?select=user_id&user_id=eq.'+encodeURIComponent(s.user.id));
 if(!access?.length){session=null;syncAdminUI();throw Error('此帳號未取得管理權限，請用建置 SQL 授權。');}
 $('login-password').value='';$('login-panel').classList.add('hidden');syncAdminUI();notice('登入成功。選擇機種後，按「編輯模式」即可修改或刪除資料。');
 }catch(e){session=null;syncAdminUI();notice(e.message,true);}finally{btn.disabled=false;}
};
$('logout').onclick=async()=>{const old=session;session=null;syncAdminUI();$('login-form').reset();$('login-email').value='';$('login-panel').classList.add('hidden');$('login-open').focus();$('login-password').value='';$('login-open').textContent='管理者登入';notice('已登出。');if(old){try{await http('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+old.access_token}},false);}catch(_){}}};
$('add-form').onsubmit=async e=>{
 e.preventDefault();const btn=e.submitter;btn.disabled=true;
 try {
 await ensureSession();const model=selectedAddModel(),cells=[$('add-title').value.trim(),$('add-content').value.trim()];
 if(!isCloudModel(model) && $('add-model').value!==NEW_MODEL_OPTION)throw Error('請選擇機種。');
 if(cells.some(x=>!x))throw Error('項目與處理內容皆為必填。');
 const signature=JSON.stringify([model,cells]);if(!pendingRecord||pendingRecord.signature!==signature) pendingRecord={signature,id:crypto.randomUUID()};
 await http('/rest/v1/equipment_records?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({id:pendingRecord.id,model,cells,style:{},sort_order:100000,created_by:session.user.id})});
 pendingRecord=null;addModelLocally(model);$('add-form').reset();toggleNewModel();$('add-panel').classList.add('hidden');sheetSelect.value=model;syncAdminUI();$('search-input').value='';notice('已成功儲存到雲端資料庫。其他裝置按重新整理即可看到。');await loadEquipment(model);
 }catch(e){notice('未確認儲存成功：'+e.message+' 若為網路問題，保留相同內容再按儲存可安全重試。新增機種前請先執行「啟用新增機種.sql」。',true);}finally{btn.disabled=false;}
};

let activeRows = null, editingRecord = null, mutationBusy = false, editMode = false;
function closeEditor() {
 editingRecord=null;
 $('edit-panel').classList.add('hidden');
 $('edit-form').reset();
 $('edit-feedback').textContent='';
}
function mutationError(error) {
 return error.message+' 若尚未更新資料庫權限，請先執行隨檔提供的「啟用修改刪除.sql」。';
}
function recordPath(record) {
 if(!record.updated_at) throw Error('請先執行「啟用修改刪除.sql」，再重新整理資料。');
 return '/rest/v1/equipment_records?id=eq.'+encodeURIComponent(record.id)+'&updated_at=eq.'+encodeURIComponent(record.updated_at);
}
function editRecord(record) {
 if(!session || !editMode || mutationBusy) return;
 editingRecord=JSON.parse(JSON.stringify(record));
 $('edit-model').value=record.model;
 $('edit-title').value=String(record.cells[0]??'');
 $('edit-content').value=String(record.cells[1]??'');
 $('edit-feedback').textContent='';
 $('add-panel').classList.add('hidden');
 $('edit-panel').classList.remove('hidden');
 $('edit-title').focus();
}
function addRowActions(rows) {
 if(!session || !editMode)return;
 container.querySelectorAll('tbody tr').forEach((tr,i)=>{
  const row=rows[i];if(!row?.id)return;
  const td=document.createElement('td');td.className='row-actions';
  const label=String(row.cells[0]||'未命名項目');
  for(const [text,action] of [['修改',()=>editRecord(row)],['刪除',()=>deleteRecord(row)]]) {
   const b=document.createElement('button');b.type='button';b.textContent=text;b.disabled=mutationBusy;
   b.setAttribute('aria-label',text+'：'+label);b.className=text==='刪除'?'delete-record':'edit-record';b.onclick=action;td.appendChild(b);
  }
  tr.appendChild(td);
 });
}
async function deleteRecord(record) {
 if(!session || !editMode || mutationBusy)return;
 if(!window.confirm('確定刪除這筆資料？\n機種：'+record.model+'\n項目：'+String(record.cells[0])+'\n\n刪除後無法在網頁復原。'))return;
 mutationBusy=true;syncAdminUI();
 try {
  await ensureSession();
  const result=await http(recordPath(record),{method:'DELETE',headers:{Prefer:'return=representation'}});
  if(!Array.isArray(result)||result.length!==1)throw Error('未刪除資料：資料可能已被其他人修改／刪除，或帳號沒有權限。請重新整理後確認。');
  if(editingRecord?.id===record.id)closeEditor();
  notice('已刪除「'+String(record.cells[0])+'」。');
  if(sheetSelect.value===record.model)await loadEquipment(record.model);
 }catch(e){notice(mutationError(e),true);}
 finally{mutationBusy=false;syncAdminUI();}
}
Object.keys(INITIAL_DATA).forEach(name=>$('edit-model').add(new Option(name,name)));
$('edit-cancel').onclick=closeEditor;
$('edit-form').onsubmit=async e=>{
 e.preventDefault();if(!session||!editMode||mutationBusy||!editingRecord)return;
 const record=editingRecord, model=$('edit-model').value, cells=[$('edit-title').value.trim(),$('edit-content').value.trim()];
 if(cells.some(c=>!c)){ $('edit-feedback').textContent='項目與處理內容皆為必填。';return; }
 mutationBusy=true;$('edit-fields').disabled=true;syncAdminUI();$('edit-feedback').textContent='儲存中…';
 try {
  await ensureSession();
  const result=await http(recordPath(record),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({model,cells})});
  if(!Array.isArray(result)||result.length!==1)throw Error('未更新資料：資料可能已被其他人修改／刪除，或帳號沒有權限。請重新整理後重新開啟修改。');
  closeEditor();sheetSelect.value=model;syncAdminUI();$('search-input').value='';notice('修改已儲存到雲端資料庫。');await loadEquipment(model);
 }catch(e){const msg=mutationError(e);$('edit-feedback').textContent=msg;notice(msg,true);}
 finally{mutationBusy=false;$('edit-fields').disabled=false;syncAdminUI();}
};

$('edit-mode-toggle').onclick=()=>{
 if(!session || mutationBusy || !isCloudModel(sheetSelect.value))return;
 if(editMode && editingRecord) {
  const changed=$('edit-model').value!==editingRecord.model || $('edit-title').value!==String(editingRecord.cells[0]??'') || $('edit-content').value!==String(editingRecord.cells[1]??'');
  if(changed && !window.confirm('修改尚未儲存，確定放棄修改並離開編輯模式？'))return;
 }
 editMode=!editMode;
 if(!editMode)closeEditor();
 syncAdminUI();
 notice(editMode ? '已進入編輯模式，可使用各筆資料旁的「修改／刪除」。' : '已離開編輯模式。');
};
sheetSelect.addEventListener('change',()=>{
 if(!isCloudModel(sheetSelect.value)) { editMode=false; closeEditor(); }
 syncAdminUI();
});
for(const id of ['btn-part','btn-ftr'])$(id).addEventListener('click',()=>{
 editMode=false;closeEditor();syncAdminUI();
});

const NEW_MODEL_OPTION='__new_model__';
let modelNames=Object.keys(INITIAL_DATA), modelRequest=0;
function isCloudModel(name){return modelNames.includes(name);}
function fillModelSelects(){
 for(const id of ['sheet-select','add-model','edit-model']){
  const el=$(id),previous=el.value;el.replaceChildren();
  if(id==='sheet-select')el.add(new Option('請選擇',''));
  modelNames.forEach(name=>el.add(new Option(name,name)));
  if(id==='sheet-select')el.add(new Option('D6對折裝訂調整','D6對折裝訂調整'));
  if(id==='add-model')el.add(new Option('＋ 新增機種…',NEW_MODEL_OPTION));
  if([...el.options].some(o=>o.value===previous))el.value=previous;
 }
 toggleNewModel();
}
function toggleNewModel(){
 const isNew=$('add-model').value===NEW_MODEL_OPTION;
 $('new-model-field').classList.toggle('hidden',!isNew);
 $('new-model-name').required=isNew;
 $('new-model-name').disabled=!isNew;
}
function addModelLocally(name){if(!modelNames.includes(name)){modelNames.push(name);fillModelSelects();}}
async function refreshModels(){
 if(!config.url)return;
 const version=++modelRequest;let offset=0,names=[];
 for(;;){
  const batch=await http('/rest/v1/equipment_models?select=name&order=name.asc&limit=500&offset='+offset,{},false);
  if(!Array.isArray(batch)||batch.some(r=>typeof r.name!=='string'))throw Error('機種清單格式不正確。');
  names.push(...batch.map(r=>r.name));if(batch.length<500)break;offset+=batch.length;
 }
 if(version!==modelRequest)return;
 modelNames=[...new Set([...Object.keys(INITIAL_DATA),...modelNames,...names])];
 fillModelSelects();syncAdminUI();
}
function selectedAddModel(){
 if($('add-model').value!==NEW_MODEL_OPTION)return $('add-model').value;
 const name=$('new-model-name').value.trim();
 if(!name)throw Error('請輸入新機種名稱。');
 if([...name].length>100)throw Error('機種名稱最多 100 個字。');
 if(name==='D6對折裝訂調整'||name===NEW_MODEL_OPTION)throw Error('此名稱已保留，請使用其他機種名稱。');
 if(modelNames.includes(name))throw Error('此機種已存在，請在「指定機種」選擇既有機種。');
 return name;
}
$('add-model').addEventListener('change',()=>{toggleNewModel();if($('add-model').value===NEW_MODEL_OPTION)$('new-model-name').focus();});
$('refresh-data').onclick=async()=>{
 try{await refreshModels();refresh();}catch(e){notice('無法更新機種清單：'+e.message+' 請確認已執行「啟用新增機種.sql」。',true);refresh();}
};
fillModelSelects();
document.addEventListener('DOMContentLoaded',async()=>{
 try{await refreshModels();}catch(e){notice('無法載入新增機種：'+e.message+' 請先執行「啟用新增機種.sql」。',true);}
});

syncAdminUI();
status();
document.addEventListener('DOMContentLoaded', ()=>$('btn-device').click());
